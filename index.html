<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a237e">
<meta name="description" content="P-Listen 四六级英语听力真题练习，支持0.5倍慢速精听、原文对照、错题复习">
<title>P-Listen 四六级听力练习</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- ======= 首页 ======= -->
  <section id="view-home" class="view">
    <header class="topbar">
      <div class="brand">
        <div class="logo">P</div>
        <div class="brand-text">
          <h1>P-Listen</h1>
          <p>四六级英语听力真题练习</p>
        </div>
      </div>
      <button id="btn-stats" class="icon-btn" title="学习统计">📊</button>
    </header>

    <div class="tabs">
      <button class="tab active" data-level="cet4">四级 CET-4</button>
      <button class="tab" data-level="cet6">六级 CET-6</button>
    </div>

    <div class="filter-row">
      <span id="year-filter" class="year-filter">全部年份</span>
      <span class="progress-summary" id="progress-summary"></span>
    </div>

    <div id="set-list" class="set-list"></div>

    <div class="home-footer">
      <p>📌 听力材料：历年四六级真题原文，由 AI 语音朗读生成</p>
      <p>🔈 支持 0.5x – 1.5x 倍速精听、原文对照、错题复习</p>
    </div>
  </section>

  <!-- ======= 练习页 ======= -->
  <section id="view-practice" class="view hidden">
    <header class="topbar practice-top">
      <button id="btn-back" class="icon-btn">←</button>
      <div class="brand-text">
        <h1 id="practice-title">练习</h1>
        <p id="practice-subtitle"></p>
      </div>
      <span class="score-chip" id="score-chip">0/0</span>
    </header>

    <div class="passage-nav" id="passage-nav"></div>

    <div class="player-card">
      <div class="player-top">
        <div class="passage-meta">
          <span class="passage-badge" id="passage-badge">Section A</span>
          <span class="passage-name" id="passage-name"></span>
        </div>
        <div class="speed-group" id="speed-group">
          <button class="speed-btn" data-rate="0.5">0.5x</button>
          <button class="speed-btn" data-rate="0.75">0.75x</button>
          <button class="speed-btn active" data-rate="1">1x</button>
          <button class="speed-btn" data-rate="1.25">1.25x</button>
          <button class="speed-btn" data-rate="1.5">1.5x</button>
        </div>
      </div>

      <div class="player-main">
        <button id="btn-play" class="play-btn">▶</button>
        <div class="player-timeline">
          <input type="range" id="seek" min="0" max="1000" value="0">
          <div class="times">
            <span id="cur-time">0:00</span>
            <span id="dur-time">0:00</span>
          </div>
        </div>
      </div>
      <div class="player-extra">
        <button id="btn-replay" class="mini-btn" title="重播上一句/重新播放">↺ 重播</button>
        <button id="btn-transcript" class="mini-btn active" title="显示/隐藏原文">📄 原文</button>
      </div>
    </div>

    <div id="transcript-box" class="transcript-box">
      <h3>听力原文 <button id="btn-copy-transcript" class="link-btn">复制</button></h3>
      <p id="transcript-text"></p>
    </div>

    <div id="question-area" class="question-area"></div>

    <div class="practice-footer">
      <button id="btn-check" class="primary-btn">查看答案</button>
      <button id="btn-next-passage" class="primary-btn hidden">下一段</button>
      <button id="btn-finish" class="primary-btn hidden">完成本套</button>
    </div>
  </section>

  <!-- ======= 结果页 ======= -->
  <section id="view-result" class="view hidden">
    <header class="topbar">
      <button id="btn-back-home" class="icon-btn">←</button>
      <div class="brand-text"><h1>练习结果</h1><p id="result-subtitle"></p></div>
    </header>
    <div class="result-card">
      <div class="big-score" id="big-score">0</div>
      <div class="score-detail" id="score-detail"></div>
    </div>
    <div class="review-list" id="review-list"></div>
    <div class="practice-footer">
      <button id="btn-again" class="primary-btn">再练一遍</button>
      <button id="btn-home" class="ghost-btn">返回首页</button>
    </div>
  </section>

  <!-- ======= 统计页 ======= -->
  <section id="view-stats" class="view hidden">
    <header class="topbar">
      <button id="btn-back-stats" class="icon-btn">←</button>
      <div class="brand-text"><h1>学习统计</h1><p>我的练习进度</p></div>
    </header>
    <div class="stats-grid" id="stats-grid"></div>
    <div class="wrong-review">
      <h3>错题本</h3>
      <div id="wrong-list"></div>
    </div>
    <div class="practice-footer">
      <button id="btn-clear-wrong" class="ghost-btn">清空错题本</button>
    </div>
  </section>
</div>

<!-- 安装提示 -->
<div id="install-banner" class="install-banner hidden">
  <span>📲 把 P-Listen 安装到桌面 / 主屏幕，离线也能练</span>
  <button id="btn-install">安装</button>
  <button id="btn-install-close">✕</button>
</div>

<script src="data.js?v=5"></script>
<script src="app.js?v=5"></script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>
</body>
</html>
